<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Game</title>
    <script src="https://code.jquery.com/jquery-3.7.0.js" integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM=" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1 class="page-header" id="topbar"></h1>
        
        <div id="creategame" class="creation-form">
            <div class="logo-container">
                <img src="../icons/iconnb.png" alt="Electoria Engine" class="logo">
            </div>
            
            <div class="form-group">
                <label for="name">Game name</label>
                <input id="name" class="input-field" placeholder="Enter game name" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="comname">Company name</label>
                <input id="comname" class="input-field" placeholder="Enter company name" autocomplete="off">
            </div>
            
            <button onclick="selecttemp(verrr)" class="create-button">
                <span>Create game!</span>
                <i class="fas fa-rocket"></i>
            </button>
        </div>
        
        <div id="templates" class="templates-container"></div>
    </div>

    <script>
        var verrr = 0;  
        var xname = ""
        var comname = ""
        var opened = ""

        document.addEventListener('keydown', function(event) {
            if (event.keyCode === 13) {
                if(!opened) {
                    selecttemp(verrr)
                } else {
                    sendengine({open:'blank'})
                }
            }
        });

        function sendengine(x){
            if(x.open == "blank") x.open = verrr+x.open
            console.log(JSON.stringify({
                open:x.open,
                name:xname,
                comname:comname
            })
        )}

        function version(y){verrr = y}
        function selecttemp(y){
            xname = document.getElementById("name").value
            comname = document.getElementById("comname").value
            if(!xname || !comname) return;
            opened = true
            document.getElementById("creategame").remove()
            $("#templates").append(`<div class="template-card" onclick="sendengine({open:'blank'})"><div class="card-inner"><span class="template-name">Blank</span><i class="fas fa-file-alt template-icon"></i></div></div>`)
            document.getElementById("topbar").innerHTML = y+"D GAMES"
            y= y+"d_"
            
            $.ajax({
                url: "https://api.github.com/repos/DeveloperKubilay/electoria-engine/contents/docs/demoGames",
                method: "GET",
                dataType: "json",
                success: function(response) {
                    response.filter((x)=>x.type == "dir").map((x)=>{
                        if(!x.name.startsWith(y)) return;
                        x.url = "https://developerkubilay.github.io/electoria-engine/demoGames/"+x.name+"/ingame.html"
                        $("#templates").append(`<div class="template-card" onclick="sendengine({open:'${x.name}'})"><div class="card-inner"><span class="template-name">${x.name.replace("2d_","").replace("3d_","")}</span><i class="fas fa-gamepad template-icon"></i></div></div>`)
                    })
                },
                error: function(error) {
                    $("#templates").append(`<div class="error-message">Couldn't load templates. Please check your connection.</div>`)
                }
            });
        }
    </script>
    
<style>
:root {
    --primary: #ff8906;
    --secondary: #f25f4c;
    --dark: #0f0e17;
    --dark-alt: #1f1d2c;
    --light: #fffffe;
    --gray: #a7a9be;
    --purple: #7f5af0;
    --gradient: linear-gradient(135deg, var(--purple) 0%, var(--primary) 100%);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, var(--dark) 0%, var(--dark-alt) 100%);
    color: var(--light);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.container {
    width: 100%;
    max-width: 900px;
    padding: 2rem;
}

.page-header {
    text-align: center;
    color: var(--primary);
    font-size: 2.5rem;
    font-weight: 600;
    margin-bottom: 3rem;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
    position: relative;
}

.page-header:after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 3px;
    background: var(--gradient);
    border-radius: 3px;
}

.creation-form {
    background: rgba(31, 29, 43, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 2.5rem;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.05);
    max-width: 600px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
}

.creation-form:before {
    content: '';
    position: absolute;
    top: -100px;
    left: -100px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: rgba(255, 137, 6, 0.1);
    z-index: -1;
}

.creation-form:after {
    content: '';
    position: absolute;
    bottom: -100px;
    right: -100px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: rgba(127, 90, 240, 0.1);
    z-index: -1;
}

.logo-container {
    text-align: center;
    margin-bottom: 2rem;
}

.logo {
    width: 120px;
    height: auto;
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 1rem;
    font-weight: 500;
    color: var(--primary);
}

.input-field {
    width: 100%;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 1rem 1.5rem;
    color: var(--light);
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    transition: all 0.3s ease;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
}

.input-field:focus {
    outline: none;
    border-color: var(--purple);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 3px rgba(127, 90, 240, 0.2);
}

.create-button {
    margin-top: 2rem;
    width: 100%;
    background: var(--gradient);
    color: var(--light);
    border: none;
    border-radius: 10px;
    padding: 1rem;
    font-size: 1.1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(127, 90, 240, 0.3);
}

.create-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(127, 90, 240, 0.4);
}

.create-button:active {
    transform: translateY(0);
}

.create-button span {
    position: relative;
    z-index: 1;
}

.create-button i {
    position: relative;
    z-index: 1;
    transition: transform 0.3s ease;
}

.create-button:hover i {
    transform: translateX(3px);
}

.create-button:before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: all 0.6s ease;
}

.create-button:hover:before {
    left: 100%;
}

.templates-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 3rem;
}

.template-card {
    background: rgba(31, 29, 43, 0.6);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.05);
    cursor: pointer;
    transition: all 0.3s ease;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.template-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
    border-color: rgba(127, 90, 240, 0.3);
}

.template-card:before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: var(--gradient);
}

.card-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    width: 100%;
    height: 100%;
    gap: 15px;
}

.template-name {
    font-size: 1.2rem;
    font-weight: 500;
    text-align: center;
    color: var(--light);
}

.template-icon {
    font-size: 3rem;
    color: var(--primary);
    transition: transform 0.3s ease, color 0.3s ease;
}

.template-card:hover .template-icon {
    transform: scale(1.1);
    color: var(--purple);
}

.error-message {
    grid-column: 1 / -1;
    text-align: center;
    padding: 1.5rem;
    color: var(--secondary);
    background: rgba(242, 95, 76, 0.1);
    border-radius: 10px;
    border: 1px solid rgba(242, 95, 76, 0.3);
}

@media (max-width: 768px) {
    .container {
        padding: 1rem;
    }
    
    .creation-form {
        padding: 1.5rem;
    }
    
    .templates-container {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
}
</style>
</body>
</html>
